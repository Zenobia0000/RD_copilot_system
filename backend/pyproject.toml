[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "design-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for RD Design Copilot — AI Agent orchestration with TRIZ knowledge base"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "supabase>=2.12.0",
    "PyJWT>=2.8.0",
    "anthropic>=0.42.0",
    "openai>=1.0",
    "pydantic-ai>=0.0.14",
    "mcp>=1.0",
]

[project.optional-dependencies]
search = [
    "tavily-python>=0.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"