components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth JWT token

  schemas:
    # -----------------------------------------------------------------------
    # Common
    # -----------------------------------------------------------------------
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
      required: [detail]

    EvidenceReference:
      type: object
      properties:
        ref_id:
          type: string
          example: WEB-SEARCH-001
        ref_type:
          type: string
          enum: [web_search, uploaded_doc, engineering_reasoning]
        title:
          type: string
        source:
          type: string
        url:
          type: string
          default: ""
        snippet:
          type: string
          default: ""
      required: [ref_id, ref_type, title, source]

    # -----------------------------------------------------------------------
    # Brief / Definitions
    # -----------------------------------------------------------------------
    BriefExtractionRequest:
      type: object
      properties:
        project_id:
          type: string
        raw_text:
          type: string
          default: ""
        file_urls:
          type: array
          items:
            type: string
          default: []
      required: [project_id]

    ExtractedConstraint:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        source:
          type: string
        type:
          type: string
          default: hard
        feasibility:
          type: string
          default: unknown
      required: [code, description, source]

    ExtractedKpi:
      type: object
      properties:
        name:
          type: string
        target_value:
          type: string
        unit:
          type: string
        measurement_method:
          type: string
          default: ""
      required: [name, target_value, unit]

    BriefExtractionResponse:
      type: object
      properties:
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedConstraint"
        kpis:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedKpi"
        assumptions:
          type: array
          items:
            type: string
        feasibility_warnings:
          type: array
          items:
            type: string
      required: [constraints, kpis, assumptions, feasibility_warnings]

    ConstraintFeasibilityRequest:
      type: object
      properties:
        project_id:
          type: string
        mission:
          type: string
        constraints:
          type: array
          items:
            type: string
          default: []
      required: [project_id, mission]

    FeasibilityConflict:
      type: object
      properties:
        constraintA:
          type: string
        constraintB:
          type: string
        reason:
          type: string
        suggestion:
          type: string
      required: [constraintA, constraintB, reason, suggestion]

    ConstraintFeasibilityResponse:
      type: object
      properties:
        status:
          type: string
          enum: [pass, warning, conflict]
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/FeasibilityConflict"
          default: []
      required: [status]

    BriefRewriteRequest:
      type: object
      properties:
        project_id:
          type: string
        mission:
          type: string
        constraints:
          type: array
          items:
            type: string
          default: []
        kpis:
          type: array
          items:
            type: string
          default: []
      required: [project_id, mission]

    BriefRewriteResponse:
      type: object
      properties:
        rewritten_mission:
          type: string
        changes_summary:
          type: string
        evidence_references:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
          default: []
      required: [rewritten_mission, changes_summary]

    ConstraintSuggestRequest:
      type: object
      properties:
        project_id:
          type: string
        mission:
          type: string
        existing_constraints:
          type: array
          items:
            type: string
          default: []
      required: [project_id, mission]

    SuggestedConstraint:
      type: object
      properties:
        description:
          type: string
        source:
          type: string
        rationale:
          type: string
          default: ""
        ref_ids:
          type: array
          items:
            type: string
          default: []
      required: [description, source]

    ConstraintSuggestResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedConstraint"
        evidence_references:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
          default: []
      required: [suggestions]

    KpiSuggestRequest:
      type: object
      properties:
        project_id:
          type: string
        mission:
          type: string
        constraints:
          type: array
          items:
            type: string
          default: []
        existing_kpis:
          type: array
          items:
            type: string
          default: []
      required: [project_id, mission]

    SuggestedKpi:
      type: object
      properties:
        kpi_name:
          type: string
        target_value:
          type: string
        unit:
          type: string
        measurement_method:
          type: string
        rationale:
          type: string
          default: ""
        ref_ids:
          type: array
          items:
            type: string
          default: []
      required: [kpi_name, target_value, unit, measurement_method]

    KpiSuggestResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedKpi"
        evidence_references:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
          default: []
      required: [suggestions]

    TaskDef5W1HRequest:
      type: object
      properties:
        project_id:
          type: string
        mission:
          type: string
        constraints:
          type: array
          items:
            type: string
          default: []
        kpis:
          type: array
          items:
            type: string
          default: []
      required: [project_id, mission]

    TaskDef5W1HResponse:
      type: object
      properties:
        who:
          type: string
        what:
          type: string
        where:
          type: string
        when:
          type: string
        why:
          type: string
        how:
          type: string
        evidence_references:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
          default: []
      required: [who, what, where, when, why, how]

    # -----------------------------------------------------------------------
    # Socratic Questions
    # -----------------------------------------------------------------------
    SocraticRequest:
      type: object
      properties:
        project_id:
          type: string
        mission:
          type: string
        constraints:
          type: array
          items:
            type: string
          default: []
        existing_questions:
          type: array
          items:
            type: string
          default: []
      required: [project_id, mission]

    SocraticQuestion:
      type: object
      properties:
        category:
          type: string
          description: "clarification | assumption | consequence | counter | origin | reflection | reframing"
        text:
          type: string
        suggested_tag:
          type: string
          nullable: true
      required: [category, text]

    SocraticResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/SocraticQuestion"
      required: [questions]

    AnsweredQuestion:
      type: object
      properties:
        id:
          type: string
          default: ""
        category:
          type: string
        question:
          type: string
        answer:
          type: string
      required: [category, question, answer]

    SocraticFollowUpRequest:
      type: object
      properties:
        project_id:
          type: string
        mission:
          type: string
        constraints:
          type: array
          items:
            type: string
          default: []
        answered_questions:
          type: array
          items:
            $ref: "#/components/schemas/AnsweredQuestion"
      required: [project_id, mission, answered_questions]

    FollowUpItem:
      type: object
      properties:
        category:
          type: string
        text:
          type: string
        reason:
          type: string
      required: [category, text, reason]

    SocraticFollowUpResponse:
      type: object
      properties:
        follow_ups:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpItem"
          default: []
        depth_sufficient:
          type: boolean
          default: false
      required: []

    ExistingQuestionItem:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        text:
          type: string
        answer:
          type: string
          default: ""
      required: [id, category, text]

    SocraticBriefImpactRequest:
      type: object
      properties:
        project_id:
          type: string
        new_mission:
          type: string
        new_constraints:
          type: array
          items:
            type: string
          default: []
        existing_questions:
          type: array
          items:
            $ref: "#/components/schemas/ExistingQuestionItem"
      required: [project_id, new_mission, existing_questions]

    AffectedQuestionItem:
      type: object
      properties:
        id:
          type: string
        reason:
          type: string
        replacement:
          $ref: "#/components/schemas/SocraticQuestion"
      required: [id, reason, replacement]

    SocraticBriefImpactResponse:
      type: object
      properties:
        affected:
          type: array
          items:
            $ref: "#/components/schemas/AffectedQuestionItem"
          default: []
        unaffected_ids:
          type: array
          items:
            type: string
          default: []

    UntaggedQuestion:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        text:
          type: string
        answer:
          type: string
          default: ""
      required: [id, category, text]

    SocraticAutoTagRequest:
      type: object
      properties:
        project_id:
          type: string
        mission:
          type: string
        constraints:
          type: array
          items:
            type: string
          default: []
        existing_assumptions:
          type: array
          items:
            type: string
          default: []
        existing_contradictions:
          type: array
          items:
            type: string
          default: []
        untagged_questions:
          type: array
          items:
            $ref: "#/components/schemas/UntaggedQuestion"
      required: [project_id, mission, untagged_questions]

    AutoTagSuggestion:
      type: object
      properties:
        question_id:
          type: string
        suggested_tag:
          type: string
          enum: [assumption, contradiction, none]
        reason:
          type: string
          default: ""
      required: [question_id, suggested_tag]

    SocraticAutoTagResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/AutoTagSuggestion"
          default: []

    # -----------------------------------------------------------------------
    # CLD
    # -----------------------------------------------------------------------
    CldGenerationRequest:
      type: object
      properties:
        project_id:
          type: string
        contradictions:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
        mission:
          type: string
          default: ""
        constraints:
          type: array
          items:
            type: string
          default: []
        kpis:
          type: array
          items:
            type: string
          default: []
        socraticAnswers:
          type: array
          items:
            type: string
          default: []
      required: [project_id, contradictions, assumptions]

    CldNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          default: variable
      required: [id, label]

    CldEdge:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        polarity:
          type: string
          default: "+"
        source_id:
          type: string
          default: ""
      required: [from, to]

    CldLoop:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [reinforcing, balancing]
        node_ids:
          type: array
          items:
            type: string
      required: [id, type, node_ids]

    CldBreakpoint:
      type: object
      properties:
        node_id:
          type: string
        rationale:
          type: string
          default: ""
      required: [node_id]

    CldGenerationResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/CldNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/CldEdge"
        loops:
          type: array
          items:
            $ref: "#/components/schemas/CldLoop"
          default: []
        breakpoints:
          type: array
          items:
            $ref: "#/components/schemas/CldBreakpoint"
      required: [nodes, edges, breakpoints]

    # -----------------------------------------------------------------------
    # Contradictions
    # -----------------------------------------------------------------------
    ContradictionFormalizeRequest:
      type: object
      properties:
        project_id:
          type: string
        contradiction_id:
          type: string
        natural_description:
          type: string
        mission:
          type: string
          default: ""
        constraints:
          type: array
          items:
            type: string
          default: []
        kpis:
          type: array
          items:
            type: string
          default: []
        socraticAnswers:
          type: array
          items:
            type: string
          default: []
      required: [project_id, contradiction_id, natural_description]

    ContradictionFormalizeResponse:
      type: object
      properties:
        engineering_statement:
          type: string
        improving_param:
          type: integer
          nullable: true
        worsening_param:
          type: integer
          nullable: true
        physical_contradiction:
          type: string
          nullable: true
          deprecated: true
          description: "Deprecated — PC/SF derived at Create stage (ADR-007)"
        pc_attribute_a:
          type: string
          nullable: true
          deprecated: true
        pc_attribute_not_a:
          type: string
          nullable: true
          deprecated: true
        sf_substance_1:
          type: string
          nullable: true
          deprecated: true
        sf_substance_2:
          type: string
          nullable: true
          deprecated: true
        sf_field:
          type: string
          nullable: true
          deprecated: true
        sf_interaction:
          type: string
          nullable: true
          deprecated: true
        sf_completeness:
          type: string
          nullable: true
          deprecated: true
        type:
          type: string
          enum: [TC]
          nullable: true
          default: TC
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
        rationale:
          type: string
          nullable: true
      required: [engineering_statement]

    ContradictionDecomposeRequest:
      type: object
      properties:
        project_id:
          type: string
        parent_contradiction_id:
          type: string
        engineering_statement:
          type: string
        improving_param:
          type: integer
          nullable: true
        worsening_param:
          type: integer
          nullable: true
        severity:
          type: string
          default: minor
        mission:
          type: string
          default: ""
        constraints:
          type: array
          items:
            type: string
          default: []
        kpis:
          type: array
          items:
            type: string
          default: []
        socraticAnswers:
          type: array
          items:
            type: string
          default: []
        candidate_principles:
          type: array
          items:
            type: integer
          default: []
        rd_manual:
          type: boolean
          default: false
      required: [project_id, parent_contradiction_id, engineering_statement]

    DecomposedPC:
      type: object
      properties:
        derived_parameter:
          type: string
        subsystem_hint:
          type: string
        physical_contradiction:
          type: string
        pc_attribute_a:
          type: string
        pc_attribute_not_a:
          type: string
        separation_principle_id:
          type: string
        separation_category:
          type: string
          enum: [time, space, condition, whole_part]
        separation_rationale:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
      required:
        - derived_parameter
        - subsystem_hint
        - physical_contradiction
        - pc_attribute_a
        - pc_attribute_not_a
        - separation_principle_id
        - separation_category
        - separation_rationale

    ContradictionDecomposeResponse:
      type: object
      properties:
        triggered:
          type: boolean
        trigger_reason:
          type: string
        decomposed_pcs:
          type: array
          items:
            $ref: "#/components/schemas/DecomposedPC"
          default: []
        reasoning:
          type: string
          default: ""
      required: [triggered, trigger_reason]

    ContradictionDeriveSFRequest:
      type: object
      properties:
        project_id:
          type: string
        contradiction_id:
          type: string
        engineering_statement:
          type: string
        improving_param:
          type: integer
          minimum: 1
          maximum: 39
        worsening_param:
          type: integer
          minimum: 1
          maximum: 39
        natural_description:
          type: string
          default: ""
      required: [project_id, contradiction_id, engineering_statement, improving_param, worsening_param]

    ContradictionDeriveSFResponse:
      type: object
      properties:
        derived:
          type: boolean
        sf_substance_1:
          type: string
          nullable: true
        sf_substance_2:
          type: string
          nullable: true
