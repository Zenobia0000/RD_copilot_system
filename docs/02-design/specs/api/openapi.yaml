openapi: 3.1.0
info:
  title: Design Copilot Backend
  version: 0.2.0
  description: |
    RD Design Copilot — AI-driven early-stage concept design decision platform.
    Integrates SCAMPER/TRIZ divergence + KT decision convergence + evidence-driven 8-Gate process.

    ## Authentication
    All business endpoints require a valid JWT Bearer token issued by Supabase Auth.
    The sole exception is `POST /observability/web-vitals` (auth-less by design, sendBeacon cannot attach headers).

    ## Error Format
    All errors follow the standard FastAPI `HTTPValidationError` shape for 422, plus
    custom 400/404/502 responses documented per-endpoint.
  contact:
    name: RD Design Copilot Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.designcopilot.example.com
    description: Production (placeholder)

security:
  - BearerAuth: []

tags:
  - name: health
    description: Health check
  - name: 任務定義 definitions
    description: Brief extraction, rewrite, constraint/KPI suggestion, 5W1H generation
  - name: 蘇格拉底問答 questions
    description: Socratic question generation, follow-up, brief impact, auto-tag
  - name: 因果迴路 causal-loops
    description: CLD (Causal Loop Diagram) generation
  - name: 矛盾管理 contradictions
    description: Contradiction formalization, TC→PC decomposition, SF derivation
  - name: 假設台帳 assumptions
    description: Assumption extraction from Socratic Q&A
  - name: 方案管理 alternatives
    description: Anti-anchor route generation, validation passport
  - name: TRIZ 求解 triz
    description: "TRIZ solving: primitive, Su-Field, layered (v7 legacy), directed (v8), consolidation"
  - name: SCAMPER scamper
    description: SCAMPER transform, subsystem suggestions, spatial overlay, feedback contradictions
  - name: 風險登錄 risks
    description: FMEA-style risk analysis
  - name: 行動建議 actions
    description: Action suggestion generation
  - name: 收斂掃描 convergence
    description: Secondary contradiction detection + architecture health scan
  - name: MUST 篩選 must
    description: AI-assisted MUST Go/No-Go evaluation
  - name: Pre-CAD 審查 pre-cad-reviews
    description: Pre-CAD 5D AI scoring and analysis
  - name: WANT 評分 want
    description: WANT criteria seeding
  - name: Gate 檢查 gates
    description: 8-Gate pass/fail check with optional AI review
  - name: 匯出 export
    description: Project data export (JSON / Markdown)
  - name: 知識回寫 knowledge
    description: Knowledge asset writeback (6 artifact types)
  - name: 未知集合 unknown-factors
    description: Unknown factor / design blind spot discovery
  - name: 空間查找 spatial
    description: Component overrides, learned component promotion
  - name: 驗證護照 validation
    description: Validation passport generation for solution hypotheses
  - name: observability
    description: Web Vitals ingestion (auth-less)
  # --- v0.2.0 新增 (ADR-008) ---
  - name: 分析 v2 analyst-v2
    description: "Auto-TRIZ v2 analysis: 5Why, KT Is/IsNot, Function Analysis, OZ-OT, Entry Grading"
  - name: 證據登錄 evidence
    description: Evidence claim registration, verification (WebSearch), coverage statistics

paths:
  # =========================================================================
  # Health
  # =========================================================================
  /api/v1/health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # =========================================================================
  # 任務定義 definitions
  # =========================================================================
  /api/v1/definitions/extract:
    post:
      operationId: definitionsExtract
      tags: [任務定義 definitions]
      summary: Extract constraints, KPIs, assumptions from raw text/upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefExtractionRequest"
      responses:
        "200":
          description: Extraction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefExtractionResponse"

  /api/v1/definitions/rewrite:
    post:
      operationId: definitionsRewrite
      tags: [任務定義 definitions]
      summary: AI-powered mission rewrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefRewriteRequest"
      responses:
        "200":
          description: Rewritten mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefRewriteResponse"

  /api/v1/definitions/check-feasibility:
    post:
      operationId: definitionsCheckFeasibility
      tags: [任務定義 definitions]
      summary: AI constraint feasibility analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstraintFeasibilityRequest"
      responses:
        "200":
          description: Feasibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstraintFeasibilityResponse"

  /api/v1/definitions/suggest-constraints:
    post:
      operationId: definitionsSuggestConstraints
      tags: [任務定義 definitions]
      summary: AI constraint suggestions from mission context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstraintSuggestRequest"
      responses:
        "200":
          description: Suggested constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstraintSuggestResponse"

  /api/v1/definitions/suggest-kpis:
    post:
      operationId: definitionsSuggestKpis
      tags: [任務定義 definitions]
      summary: AI KPI suggestions from mission + constraints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiSuggestRequest"
      responses:
        "200":
          description: Suggested KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiSuggestResponse"

  /api/v1/definitions/generate-5w1h:
    post:
      operationId: definitionsGenerate5w1h
      tags: [任務定義 definitions]
      summary: Generate 5W1H task definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDef5W1HRequest"
      responses:
        "200":
          description: 5W1H result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDef5W1HResponse"

  # =========================================================================
  # 蘇格拉底問答 questions
  # =========================================================================
  /api/v1/questions/generate:
    post:
      operationId: questionsGenerate
      tags: [蘇格拉底問答 questions]
      summary: Generate Socratic questions from brief + constraints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocraticRequest"
      responses:
        "200":
          description: Generated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocraticResponse"

  /api/v1/questions/follow-up:
    post:
      operationId: questionsFollowUp
      tags: [蘇格拉底問答 questions]
      summary: Analyze answer depth and generate follow-up questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocraticFollowUpRequest"
      responses:
        "200":
          description: Follow-up questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocraticFollowUpResponse"

  /api/v1/questions/brief-impact:
    post:
      operationId: questionsBriefImpact
      tags: [蘇格拉底問答 questions]
      summary: Evaluate which Socratic questions are affected by a Brief change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocraticBriefImpactRequest"
      responses:
        "200":
          description: Impact evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocraticBriefImpactResponse"

  /api/v1/questions/auto-tag:
    post:
      operationId: questionsAutoTag
      tags: [蘇格拉底問答 questions]
      summary: Detect hidden assumptions/contradictions in Socratic Q&A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocraticAutoTagRequest"
      responses:
        "200":
          description: Auto-tag suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocraticAutoTagResponse"

  # =========================================================================
  # 因果迴路 causal-loops
  # =========================================================================
  /api/v1/causal-loops/generate:
    post:
      operationId: causalLoopsGenerate
      tags: [因果迴路 causal-loops]
      summary: Generate Causal Loop Diagram from contradictions + assumptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CldGenerationRequest"
      responses:
        "200":
          description: CLD graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CldGenerationResponse"
        "502":
          description: CLD generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # =========================================================================
  # 矛盾管理 contradictions
  # =========================================================================
  /api/v1/contradictions/{cid}/formalize:
    post:
      operationId: contradictionsFormalize
      tags: [矛盾管理 contradictions]
      summary: Formalize natural-language contradiction into TRIZ sentence
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContradictionFormalizeRequest"
      responses:
        "200":
          description: Formalized contradiction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContradictionFormalizeResponse"

  /api/v1/contradictions/{cid}/decompose:
    post:
      operationId: contradictionsDecompose
      tags: [矛盾管理 contradictions]
      summary: Decompose a parent TC into multiple child PCs
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContradictionDecomposeRequest"
      responses:
        "200":
          description: Decomposition result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContradictionDecomposeResponse"
        "502":
          description: PC decomposition failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/contradictions/{cid}/derive-sf:
    post:
      operationId: contradictionsDeriveSf
      tags: [矛盾管理 contradictions]
      summary: Derive a child Su-Field model from a parent TC
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContradictionDeriveSFRequest"
      responses:
        "200":
          description: SF derivation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContradictionDeriveSFResponse"
        "502":
          description: SF derivation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # =========================================================================
  # 假設台帳 assumptions
  # =========================================================================
  /api/v1/assumptions/extract:
    post:
      operationId: assumptionsExtract
      tags: [假設台帳 assumptions]
      summary: Extract assumptions from Socratic question answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssumptionExtractRequest"
      responses:
        "200":
          description: Extracted assumptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumptionExtractResponse"

  # =========================================================================
  # 方案管理 alternatives
  # =========================================================================
  /api/v1/alternatives/anti-anchor:
    post:
      operationId: alternativesAntiAnchor
      tags: [方案管理 alternatives]
      summary: Generate anti-anchor (unconventional) routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AntiAnchorRequest"
      responses:
        "200":
          description: Anti-anchor routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntiAnchorResponse"

  /api/v1/alternatives/validation-passport:
    post:
      operationId: alternativesValidationPassport
      tags: [驗證護照 validation]
      summary: Generate validation passport for a solution hypothesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationPassportRequest"
      responses:
        "200":
          description: Validation passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPassportResponse"

  # =========================================================================
  # TRIZ 求解 triz
  # =========================================================================
  /api/v1/triz/solve:
    post:
      operationId: trizSolve
      tags: [TRIZ 求解 triz]
      summary: "Primitive TRIZ solve (TC/PC/SF single path) — deprecated"
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrizLookupRequest"
      responses:
        "200":
          description: TRIZ suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrizLookupResponse"

  /api/v1/triz/sufield:
    post:
      operationId: trizSufield
      tags: [TRIZ 求解 triz]
      summary: Su-Field analysis against 76 standard solutions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuFieldRequest"
      responses:
        "200":
          description: Su-Field analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuFieldResponse"

  /api/v1/triz/solve-layered:
    post:
      operationId: trizSolveLayered
      tags: [TRIZ 求解 triz]
      summary: "v7 3-layer drill-down (L1 TC → L2 PC → L3 SF) — legacy, kept for back-compat"
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveTrizLayeredRequest"
      responses:
        "200":
          description: Layered solution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveTrizLayeredResponse"

  /api/v1/triz/solve-directed:
    post:
      operationId: trizSolveDirected
      tags: [TRIZ 求解 triz]
      summary: "v8 direction-centric TRIZ solve — preferred flow"
      description: |
        7-step pipeline: TC→PC→SF→merge→LLM cluster→score→Top1/Top2.
        Single contradiction in, scored direction groups out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveDirectedRequest"
      responses:
        "200":
          description: Direction-centric result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveDirectedResponse"

  /api/v1/triz/consolidate:
    post:
      operationId: trizConsolidate
      tags: [TRIZ 求解 triz]
      summary: v8 cross-contradiction consolidation
      description: |
        Checks Top1 compatibility across multiple contradiction results;
        tries Top2 swap when conflicts arise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsolidateRequest"
      responses:
        "200":
          description: Consolidation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsolidateResponse"

  # =========================================================================
  # SCAMPER scamper
  # =========================================================================
  /api/v1/scamper/perform:
    post:
      operationId: scamperPerform
      tags: [SCAMPER scamper]
      summary: 7-action SCAMPER transform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScamperRequest"
      responses:
        "200":
          description: SCAMPER variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScamperResponse"

  /api/v1/scamper/subsystem-suggestions:
    post:
      operationId: scamperSubsystemSuggestions
      tags: [SCAMPER scamper]
      summary: Suggest subsystems for SCAMPER analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubsystemSuggestRequest"
      responses:
        "200":
          description: Suggested subsystems with optional package map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsystemSuggestResponse"
        "502":
          description: Incomplete LLM response (fail-loud, no silent fallback)
          content:
            application/json:
              schema:
                type: object
                description: IncompleteLLMResponseError.to_dict() payload

  /api/v1/scamper/spatial-overlay:
    post:
      operationId: scamperSpatialOverlay
      tags: [SCAMPER scamper]
      summary: Stateless what-if spatial overlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpatialOverlayRequest"
      responses:
        "200":
          description: Package map with overlay applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpatialOverlayResponse"

  /api/v1/scamper/feedback-contradictions:
    post:
      operationId: scamperFeedbackContradictions
      tags: [SCAMPER scamper]
      summary: Feed SCAMPER-generated contradictions back to contradiction management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScamperFeedbackRequest"
      responses:
        "200":
          description: Feedback result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScamperFeedbackResponse"

  # =========================================================================
  # 風險登錄 risks
  # =========================================================================
  /api/v1/risks/analyze:
    post:
      operationId: risksAnalyze
      tags: [風險登錄 risks]
      summary: FMEA-style risk analysis (P × S scoring)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskAnalysisRequest"
      responses:
        "200":
          description: Risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAnalysisResponse"

  # =========================================================================
  # 行動建議 actions
  # =========================================================================
  /api/v1/actions/suggest:
    post:
      operationId: actionsSuggest
      tags: [行動建議 actions]
      summary: Generate action suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionSuggestRequest"
      responses:
        "200":
          description: Action suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionSuggestResponse"

  # =========================================================================
  # 收斂掃描 convergence
  # =========================================================================
  /api/v1/convergence/scan:
    post:
      operationId: convergenceScan
      tags: [收斂掃描 convergence]
      summary: Detect secondary contradictions + architecture health scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvergenceScanRequest"
      responses:
        "200":
          description: Convergence scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvergenceScanResponse"

  # =========================================================================
  # MUST 篩選 must
  # =========================================================================
  /api/v1/must/evaluate:
    post:
      operationId: mustEvaluate
      tags: [MUST 篩選 must]
      summary: AI-assisted MUST Go/No-Go evaluation
      description: |
        AI pre-judges MUST pass/fail with confidence + reasoning.
        RD can override on frontend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MustEvaluationRequest"
      responses:
        "200":
          description: MUST evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MustEvaluationResponse"

  # =========================================================================
  # Pre-CAD 審查 pre-cad-reviews
  # =========================================================================
  /api/v1/pre-cad-reviews/{rid}/ai-analyze:
    post:
      operationId: preCadAiAnalyze
      tags: [Pre-CAD 審查 pre-cad-reviews]
      summary: Pre-CAD 5D AI scoring and analysis
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreCadAnalyzeRequest"
      responses:
        "200":
          description: 5D scores and analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreCadAnalyzeResponse"

  # =========================================================================
  # WANT 評分 want
  # =========================================================================
  /api/v1/want/criteria/seed:
    post:
      operationId: wantCriteriaSeed
      tags: [WANT 評分 want]
      summary: Generate W1–W6 WANT criteria from mission context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WantSeedRequest"
      responses:
        "200":
          description: Seeded WANT criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantSeedResponse"

  # =========================================================================
  # Gate 檢查 gates
  # =========================================================================
  /api/v1/gates/{gate_id}/check:
    get:
      operationId: gatesCheck
      tags: [Gate 檢查 gates]
      summary: Gate pass/fail check with optional AI review
      parameters:
        - name: gate_id
          in: path
          required: true
          schema:
            type: string
            enum: ["1.1", "1.2", "PG1", "2.1", "2.2", "PG2", "3.2", "PG3"]
        - name: project_id
          in: query
          required: true
          schema:
            type: string
        - name: include_ai_review
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Gate check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateCheckResponse"
        "400":
          description: Invalid gate_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # =========================================================================
  # 匯出 export
  # =========================================================================
  /api/v1/export:
    post:
      operationId: exportProject
      tags: [匯出 export]
      summary: Export project data (JSON or Markdown)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Exported content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # =========================================================================
  # 知識回寫 knowledge
  # =========================================================================
  /api/v1/knowledge/writeback:
    post:
      operationId: knowledgeWriteback
      tags: [知識回寫 knowledge]
      summary: Auto-assetize 6 artifact types into knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeWritebackRequest"
      responses:
        "200":
          description: Writeback result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeWritebackResponse"

  # =========================================================================
  # 未知集合 unknown-factors
  # =========================================================================
  /api/v1/unknown-factors/discover:
    post:
      operationId: unknownFactorsDiscover
      tags: [未知集合 unknown-factors]
      summary: Discover design blind spots from project context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnknownFactorDiscoverRequest"
      responses:
        "200":
          description: Discovered unknown factors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnknownFactorDiscoverResponse"

  # =========================================================================
  # 空間查找 spatial
  # =========================================================================
  /api/v1/spatial/component-overrides:
    post:
      operationId: createComponentOverride
      tags: [空間查找 spatial]
